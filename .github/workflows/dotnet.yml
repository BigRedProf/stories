name: .NET

permissions:
  contents: read
  # Lets the job request the GitHub OIDC token that nuget.org trades for a
  # short-lived publishing key. See the NuGet login step below.
  id-token: write

# A release is a TAG, not a merge. Merges to main build and test; only a tag
# publishes. nuget.org versions are immutable and effectively permanent, so a
# published version should mean "we meant this one" rather than "someone
# merged". MinVer derives versions from these same tags, so the gate and the
# artifact cannot disagree.
#
# TWO tag prefixes, because this repository ships two things on independent
# version lines (stories#5):
#   v*          the four BigRedProf.Stories.* library packages, to nuget.org
#   psmodule-v* the BigRedProf.Stories PowerShell module, to the PS Gallery
# Each publish step gates on its own prefix, so releasing one never drags the
# other along.
on:
  push:
    branches: [ "main" ]
    tags: [ "v*", "psmodule-v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is REQUIRED, not tidiness. MinVer reads the version from
      # git history, and the default shallow checkout has no tags -- every build
      # would silently produce an alpha and every release would ship the wrong
      # version.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.403
      # Task is the repository's orchestration layer, so CI is a thin wrapper
      # around it rather than a second, drifting copy of the build steps.
      - name: Setup Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # `task verify` is restore + build + test, and is the same command
      # developers and agents run locally. It restores once and tests without
      # rebuilding, so there is no separate restore step here.
      - name: Verify (Debug)
        run: task verify
      # An ambient environment variable wins over the value in .env, so this
      # runs the identical graph against Release.
      - name: Verify (Release)
        run: task verify
        env:
          BRP_DOTNET_CONFIGURATION: Release
      # Packaging and publishing stay as explicit dotnet steps. `task pack`
      # exists for local use and deliberately cannot push, so this workflow
      # remains the only thing that can release a package.
      #
      # Pack runs on pull requests too -- it publishes nothing, and knowing the
      # packages still build is worth having before merge.
      # Packed to one directory so the push below is a single glob rather than
      # one step per package that has to be remembered when a fifth is added.
      - name: Pack
        run: dotnet pack -c Release -o ${{ github.workspace }}/artifacts/packages
        working-directory: src
      # The temporary key is valid for one hour and each OIDC token buys exactly
      # one key, so this sits immediately before the push rather than earlier in
      # the job. It is gated on the tag too -- on a branch build there is
      # nothing to publish and no policy would match.
      - name: NuGet login (OIDC to short-lived key)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: BigRedProf
      # One push for every package and its symbols. `dotnet nuget push` sends a
      # matching .snupkg alongside each .nupkg automatically, so symbols need no
      # step of their own.
      #
      # --skip-duplicate is deliberately NOT used: with tag-derived versions a
      # duplicate means the same tag is being released twice, and that should
      # fail loudly rather than be quietly ignored.
      - name: Push packages to nuget.org
        if: startsWith(github.ref, 'refs/tags/v')

        run: dotnet nuget push "artifacts/packages/*.nupkg" --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
      # The PowerShell module. Staged rather than packed: a module package puts
      # its manifest and assemblies at the package root, which `dotnet pack`
      # cannot produce, so this goes through Publish-PSResource instead.
      #
      # Unlike nuget.org, the PowerShell Gallery has no trusted-publishing
      # equivalent, so this is the one long-lived key left in the release path.
      # It is scoped to this package and expires; see stories#5.
      - name: Publish the PowerShell module
        if: startsWith(github.ref, 'refs/tags/psmodule-v')
        shell: pwsh
        run: ./script/powershell-module.ps1 -Configuration Release -Publish -ApiKey $env:PSGALLERY_API_KEY
        env:
          PSGALLERY_API_KEY: ${{ secrets.BIGREDPROF_PSG_API_KEY }}
